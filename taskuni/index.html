<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans (Cuerpo) y Space Grotesk (Títulos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols Outlined -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <title>taskUni · Portal Académico</title>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-title {
      font-family: 'Space Grotesk', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .floating-logo {
      animation: float 6s ease-in-out infinite;
    }

    /* Estilo para que los iconos de Google Fonts se alineen verticalmente */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-slate-900 via-emerald-950 to-indigo-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Círculos de luz decorativos de fondo -->
  <div
    class="absolute w-[500px] h-[500px] rounded-full bg-emerald-500/10 blur-[120px] -top-40 -left-40 pointer-events-none">
  </div>
  <div
    class="absolute w-[500px] h-[500px] rounded-full bg-indigo-500/10 blur-[120px] -bottom-40 -right-40 pointer-events-none">
  </div>

  <!-- Contenedor Principal -->
  <div class="w-full max-w-lg z-10">
    <div class="glass-card rounded-3xl p-8 shadow-2xl transition-all duration-300 hover:shadow-emerald-950/20">

      <!-- Encabezado / Logo -->
      <div class="text-center mb-8">
        <div
          class="floating-logo inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-600/30 mb-4">
          <span class="material-symbols-outlined text-4xl">school</span>
        </div>
        <h1 class="font-title text-4xl font-extrabold text-slate-800 tracking-tight">taskUni</h1>
        <p class="text-slate-500 text-sm mt-2">Plataforma de Control e Indicadores Académicos</p>
      </div>

      <!-- Alerta Personalizada -->
      <div id="login-alert"
        class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-start gap-3 transition-all duration-300">
        <span class="material-symbols-outlined text-rose-600 shrink-0">error</span>
        <span id="alert-text"></span>
      </div>

      <!-- Formulario de Acceso -->
      <form id="form-login" class="space-y-5">
        <div>
          <label for="usuario" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Correo
            Institucional</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <span class="material-symbols-outlined">mail</span>
            </span>
            <input type="email" id="usuario" placeholder="usuario@unphu.edu.do"
              class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
              required>
          </div>
        </div>

        <div>
          <label for="password"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <span class="material-symbols-outlined">lock</span>
            </span>
            <input type="password" id="password" placeholder="••••••••"
              class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
              required>
          </div>
        </div>

        <button type="submit"
          class="w-full mt-2 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0 font-title">
          Iniciar Sesión
        </button>
      </form>

      <!-- Divisor -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white px-4 text-slate-400 font-semibold tracking-wider">Acceso Rápido de Prueba</span>
        </div>
      </div>

      <!-- Botones de Acceso Rápido -->
      <div class="grid grid-cols-3 gap-3">
        <button onclick="accesoRapido('admin@unphu.edu.do')"
          class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-100 hover:border-emerald-500 hover:bg-emerald-50/50 text-slate-700 transition group">
          <span
            class="material-symbols-outlined text-2xl text-slate-500 group-hover:scale-110 group-hover:text-emerald-600 transition duration-300">admin_panel_settings</span>
          <span class="text-[10px] font-bold mt-1.5 text-slate-800 font-title">Administrador</span>
        </button>

        <button onclick="accesoRapido('profe@unphu.edu.do')"
          class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-100 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-700 transition group">
          <span
            class="material-symbols-outlined text-2xl text-slate-500 group-hover:scale-110 group-hover:text-indigo-600 transition duration-300">co_present</span>
          <span class="text-[10px] font-bold mt-1.5 text-slate-800 font-title">Profesor</span>
        </button>

        <button onclick="accesoRapido('maria@unphu.edu.do')"
          class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-100 hover:border-teal-500 hover:bg-teal-50/50 text-slate-700 transition group">
          <span
            class="material-symbols-outlined text-2xl text-slate-500 group-hover:scale-110 group-hover:text-teal-600 transition duration-300">person</span>
          <span class="text-[10px] font-bold mt-1.5 text-slate-800 font-title">Estudiante</span>
        </button>
      </div>

      <!-- Pie de página -->
      <div class="mt-8 text-center">
        <p class="text-xs text-slate-400 font-medium">Prototipo de Validación · Universidad Nacional Pedro Henríquez
          Ureña</p>
      </div>

    </div>
  </div>

  <script>
    function showAlert(message) {
      const alertDiv = document.getElementById('login-alert');
      const alertText = document.getElementById('alert-text');
      alertText.textContent = message;
      alertDiv.classList.remove('hidden');
      alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function accesoRapido(email) {
      document.getElementById('usuario').value = email;
      document.getElementById('password').value = '123456';

      setTimeout(() => {
        document.getElementById('form-login').dispatchEvent(new Event('submit'));
      }, 300);
    }

    document.getElementById('form-login').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('usuario').value.trim().toLowerCase();
      const contrasena = document.getElementById('password').value;

      if (contrasena.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      let rol = '';
      if (email.startsWith('admin@')) {
        rol = 'admin';
      } else if (email.startsWith('profe@') || email.includes('maestro@')) {
        rol = 'maestro';
      } else if (email.endsWith('@unphu.edu.do')) {
        rol = 'estudiante';
      } else {
        showAlert('Correo no institucional. Utilice una dirección finalizada en @unphu.edu.do');
        return;
      }

      localStorage.setItem('taskUni_sesion', JSON.stringify({ usuario: email, rol: rol }));

      const card = document.querySelector('.glass-card');
      card.classList.add('opacity-0', 'scale-95');
      card.style.transition = 'all 0.5s ease';

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    });

    document.getElementById('usuario').addEventListener('input', () => {
      document.getElementById('login-alert').classList.add('hidden');
    });
  </script>
  <!-- Conexión con Backend -->
  <script src="js/api-client.js"></script>
</body>

</html>
