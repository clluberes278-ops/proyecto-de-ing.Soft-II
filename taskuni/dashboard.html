<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/styles.css">
  <title>taskUni · Panel de Control Académico</title>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex">

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar"
    class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 border-r border-slate-800 transition-all duration-300 no-print">
    <div class="p-6 flex items-center gap-3 border-b border-slate-800">
      <div
        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white flex items-center justify-center shadow-lg shadow-emerald-500/20 font-bold text-xl">
        <span class="material-symbols-outlined text-white text-xl">school</span>
      </div>
      <div class="flex-1">
        <h2 class="font-title text-xl font-bold text-white tracking-tight">taskUni</h2>
        <span class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">UNPHU Académico</span>
      </div>
      <button onclick="closeSidebar()"
        class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
        aria-label="Cerrar menú">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <nav class="flex-1 px-4 py-6 overflow-y-auto space-y-1" id="menu-container">
      <!-- Se carga dinámicamente -->
    </nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950 flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <div id="user-avatar"
          class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold font-title uppercase">
          US
        </div>
        <div class="overflow-hidden">
          <p id="user-email" class="text-xs font-semibold text-white truncate">usuario@unphu.edu.do</p>
          <span id="user-role-badge"
            class="inline-block text-[9px] uppercase font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 mt-0.5">Rol</span>
        </div>
      </div>
      <button id="btn-logout"
        class="w-full text-left py-2 px-3 rounded-lg text-rose-400 hover:bg-rose-950/30 hover:text-rose-300 font-medium text-xs flex items-center gap-2 transition duration-200">
        <span class="material-symbols-outlined text-sm">logout</span>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <main id="main-content" class="flex-1 flex flex-col min-w-0 transition-all duration-300">
    <header id="topbar"
      class="bg-white border-b border-slate-200 h-16 px-4 md:px-8 flex items-center justify-between shrink-0 no-print">
      <div class="flex items-center gap-3">
        <button id="btn-hamburger" onclick="openSidebar()"
          class="md:hidden p-2 rounded-lg text-slate-500 hover:text-emerald-600 hover:bg-slate-100 transition -ml-1"
          aria-label="Abrir menú">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 id="titulo-modulo"
          class="font-title text-base md:text-xl font-bold text-slate-800 truncate max-w-[180px] sm:max-w-xs md:max-w-none">
          Cargando...</h1>
      </div>

      <div class="flex items-center gap-2 md:gap-4">
        <div
          class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Período: <span id="periodo-activo-badge">9-2026</span>
        </div>

        <button onclick="confirmarReiniciarBase()"
          class="p-2 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-slate-100 transition"
          title="Reiniciar datos de prueba">
          <span class="material-symbols-outlined">restart_alt</span>
        </button>

        <button id="dark-mode-toggle"
          class="p-2 rounded-lg text-slate-400 hover:text-emerald-500 hover:bg-slate-100 transition"
          title="Cambiar tema">
          <span id="sun-icon" class="material-symbols-outlined hidden">light_mode</span>
          <span id="moon-icon" class="material-symbols-outlined">dark_mode</span>
        </button>
      </div>
    </header>

    <div class="flex-1 p-4 md:p-8 overflow-y-auto" id="print-area">
      <div id="contenedor-modulo" class="max-w-7xl mx-auto space-y-6 font-sans">
        <!-- El contenido dinámico se renderiza aquí -->
      </div>
    </div>
  </main>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full no-print"></div>

  <script src="js/api-client.js"></script>
  <script src="js/dashboard-core.js"></script>
  <script src="js/dashboard-ent.js"></script>
  <script src="js/dashboard-rpt.js"></script>
</body>

</html>
